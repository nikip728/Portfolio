name: Deploy Astro to GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Configure Pages (enable GitHub Actions in repository Pages settings first)
        id: pages
        uses: actions/configure-pages@v6.0.0
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm test
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
